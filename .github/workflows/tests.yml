name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install black flake8 isort

      - name: Lint with flake8
        run: |
          flake8 asam/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 asam/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: black --check asam/

      - name: Check imports with isort
        run: isort --check-only asam/

  test:
    name: Fast unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viz]" pytest-cov

      - name: Run fast unit tests
        run: |
          pytest -q \
            tests/test_ci_workflow.py \
            tests/test_experiment_artifact_audit.py \
            tests/test_text_dataset_provenance.py \
            tests/test_basic.py \
            tests/test_asam.py \
            tests/test_efficient.py \
            tests/test_optimized_layer.py \
            tests/test_continual_asam.py::test_continual_asam_forward_shapes \
            tests/test_continual_asam.py::test_continual_regularization_is_finite \
            tests/test_continual_asam.py::test_task_memory_update_reduces_stability_error_on_revisit \
            tests/test_continual_asam.py::test_overlap_regularization_uses_seen_task_memory_without_mixed_batch \
            tests/test_continual_asam.py::test_continual_asam_accepts_scalar_task_id \
            tests/test_continual_asam.py::test_sinkhorn_transport_matches_capacity_target \
            tests/test_continual_asam.py::test_prototype_routing_is_topk_sparse_and_memory_biased \
            tests/test_continual_asam.py::test_prototype_memory_update_enables_stability_regularization \
            tests/test_continual_asam.py::test_prototype_memory_tracks_capacity_and_support_statistics \
            tests/test_continual_asam.py::test_prototype_regularizers_are_finite_and_non_negative \
            tests/test_continual_asam.py::test_prototype_refresh_can_reset_and_split \
            tests/test_continual_asam.py::test_birkhoff_lifecycle_transition_is_doubly_stochastic_and_mass_preserving \
            tests/test_continual_asam.py::test_birkhoff_adaptive_gate_caps_applied_transport_and_preserves_gap \
            tests/test_continual_asam.py::test_prototype_prior_can_shift_toward_task_conditioned_capacity_memory \
            tests/test_continual_ablation.py::test_build_benchmark_args_forwards_transport_weight_override \
            tests/test_continual_operator_ablation.py \
            tests/test_continual_capacity_sweep.py \
            tests/test_paper_pipeline.py \
            tests/test_sync_continual_appendix.py \
            tests/test_long_context_paper_suite.py \
            --cov=asam --cov-report=xml --cov-report=term

      - name: Generate experiment artifact audit
        run: python scripts/audit_experiment_artifacts.py experiments/paper_suite_canonical_smoke experiments/paper_suite_long_context_smoke > experiment_artifact_audit.json

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            coverage.xml
            experiment_artifact_audit.json
          if-no-files-found: ignore
